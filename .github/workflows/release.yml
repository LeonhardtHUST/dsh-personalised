name: release

# package.json 的 version 变化并推到 main 后自动发版：
#   1. 若 npm 上已有该版本，跳过。
#   2. 跑全量 smoke。
#   3. 用 npm trusted publishing（OIDC，无需 NPM_TOKEN）发布，附 provenance。
#   4. 打 tag v<version> 并创建 GitHub Release。
# trusted publisher 已在 npmjs.com 绑定本仓库的 release.yml；改文件名需同步更新 npm 上的配置。
# 发布用 npm CLI 而不是 vp pm publish：OIDC trusted publishing 由 npm CLI 实现。

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version 已在 npm 上，跳过发布。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/tests.yml

  publish:
    needs: [check, tests]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: 升级 npm（trusted publishing 需要 npm >= 11.5.1）
        run: npm install -g npm@latest
      - name: 发布到 npm
        run: npm publish --provenance --access public
      - name: 打 tag 并创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          notes=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?"v"\\]?" {f=1; next}
            f && /^## / {exit}
            f {print}
          ' CHANGELOG.md)
          [ -n "$notes" ] || notes="见 CHANGELOG.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes "$notes"
