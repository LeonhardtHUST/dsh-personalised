name: tests

# 每次 push / PR 跑全量 smoke。--jobs=1 串行：部分套件读写 ~/.dsh 状态，并发会让结果不可复现。
# 排除项依赖本机产物或网络，排除原因会在日志里逐条打印。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # 被 release.yml 调用时 github.workflow 是调用方名字，避免与普通 push 运行互相取消。
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 全量 smoke
        run: >-
          node tools/run-smoke.mjs
          --jobs=1
          --timeout=240000
          --exclude=-live
          --exclude=m79-feature-v2
          --exclude=m710-fv2-emit
          --exclude=c4-fresh-install
      - name: 失败提示
        if: failure()
        run: echo "::error::smoke 有 FAIL/TIMEOUT，看上方 '--- FAIL:' 段。本地复现：node tools/run-smoke.mjs --filter=<套件名>"
